<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fencepoint Daily Sales Dashboard</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; min-height: 100vh; padding: 14px; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.2rem; font-weight: 700; color: #222; letter-spacing: 0.02em; }
    .header .date-line { font-size: 0.78rem; color: #666; margin-top: 3px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; max-width: 900px; margin: 0 auto; }
    .dial-card { background: #fff; border-radius: 10px; padding: 12px 8px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.09); }
    .dial-title { font-size: 0.78rem; font-weight: 700; color: #555; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
    .dial-svg-wrap { width: 100%; }
    .card-footer { background: #E8500A; border-radius: 10px; padding: 18px 12px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.09); }
    .footer-label { font-size: 0.78rem; font-weight: 700; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.06em; }
    .footer-value { font-size: 2.2rem; font-weight: 800; line-height: 1.1; margin-top: 6px; }
    .refresh-btn { display: block; margin: 12px auto 0; background: #E8500A; color: #fff; border: none; border-radius: 6px; padding: 9px 32px; font-size: 0.9rem; font-weight: 700; cursor: pointer; letter-spacing: 0.02em; }
    .refresh-btn:hover { background: #c94008; }
    .refresh-btn:disabled { opacity: 0.55; cursor: default; }
    .status-bar { text-align: center; font-size: 0.7rem; color: #888; margin-top: 8px; }
    .status-bar.error { color: #c0392b; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Daily Sales Dashboard</h1>
    <div class="date-line" id="date-line"></div>
  </div>

  <div class="grid">
    <div class="dial-card"><div class="dial-title">Sales Today</div><div class="dial-svg-wrap" id="dw-st"></div></div>
    <div class="dial-card"><div class="dial-title">Sales MTD</div><div class="dial-svg-wrap" id="dw-sm"></div></div>
    <div class="dial-card"><div class="dial-title">Sales Invoiced MTD</div><div class="dial-svg-wrap" id="dw-si"></div></div>
    <div class="dial-card"><div class="dial-title">GP Today</div><div class="dial-svg-wrap" id="dw-gt"></div></div>
    <div class="dial-card"><div class="dial-title">GP MTD</div><div class="dial-svg-wrap" id="dw-gm"></div></div>
    <div class="dial-card"><div class="dial-title">GP Invoiced MTD</div><div class="dial-svg-wrap" id="dw-gi"></div></div>
    <div class="card-footer">
      <span class="footer-label">GP% Today</span>
      <span class="footer-value" id="gppct-today">—</span>
    </div>
    <div class="card-footer">
      <span class="footer-label">GP% MTD</span>
      <span class="footer-value" id="gppct-mtd">—</span>
    </div>
    <div class="card-footer">
      <span class="footer-label">GP% Invoiced MTD</span>
      <span class="footer-value" id="gppct-inv">—</span>
    </div>
  </div>

  <button class="refresh-btn" id="refresh-btn" onclick="handleRefresh()">&#8635; Load Data</button>
  <div class="status-bar" id="status-bar">Click Load Data to fetch live figures from Odoo.</div>

  <script>
    const MONTHLY_SALES_TARGET = 312500;
    const MONTHLY_GP_TARGET    = 100000;

    const R = 74, CX = 100, CY = 92, SW = 15;

    function buildDial(pct, color, actualText, targetText) {
      const clamped = Math.min(0.9999, Math.max(0.0001, pct));
      const arcColor = pct >= 1.0 ? '#27ae60' : color;
      var trackPath = 'M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY;
      var theta = Math.PI * (1 - clamped);
      var ex = (CX + R * Math.cos(theta)).toFixed(3);
      var ey = (CY - R * Math.sin(theta)).toFixed(3);
      var valuePath = 'M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+ex+' '+ey;
      var pctLabel = Math.round(Math.min(1, pct) * 100) + '% of target';
      var svg = '<svg viewBox="0 0 200 118" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">';
      svg += '<path d="'+trackPath+'" fill="none" stroke="#e5e5e5" stroke-width="'+SW+'" stroke-linecap="round"/>';
      if (pct > 0.001) svg += '<path d="'+valuePath+'" fill="none" stroke="'+arcColor+'" stroke-width="'+SW+'" stroke-linecap="round"/>';
      svg += '<text x="'+CX+'" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#1a1a1a">'+actualText+'</text>';
      svg += '<text x="'+CX+'" y="83" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#aaa">TARGET: '+targetText+'</text>';
      svg += '<text x="'+CX+'" y="110" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#888">'+pctLabel+'</text>';
      svg += '</svg>';
      return svg;
    }

    function setDial(id, color, actual, target) {
      var pct = target > 0 ? actual / target : 0;
      var el = document.getElementById(id);
      if (el) el.innerHTML = buildDial(pct, color, fmt(actual), fmt(target));
    }
    function initDials() {
      ['dw-st','dw-sm','dw-si'].forEach(id => { var el = document.getElementById(id); if (el) el.innerHTML = buildDial(0.001, '#E8500A', '...', '...'); });
      ['dw-gt','dw-gm','dw-gi'].forEach(id => { var el = document.getElementById(id); if (el) el.innerHTML = buildDial(0.001, '#A0A0A0', '...', '...'); });
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function todayStr() { var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function monthStartStr() { var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'; }

    var UK_BANK_HOLIDAYS = new Set(['2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-05-26','2025-08-25','2025-12-25','2025-12-26','2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-08-31','2026-12-25','2026-12-28']);
    var WORKING_DAY_OVERRIDES = { '2026-05': 20 };

    function workingDaysInMonth() {
      var d = new Date(), year = d.getFullYear(), month = d.getMonth();
      var key = year + '-' + pad(month + 1);
      if (WORKING_DAY_OVERRIDES[key] !== undefined) return WORKING_DAY_OVERRIDES[key];
      var days = new Date(year, month + 1, 0).getDate(), count = 0;
      for (var i = 1; i <= days; i++) {
        var dt = new Date(year, month, i), dow = dt.getDay();
        var iso = year+'-'+pad(month+1)+'-'+pad(i);
        if (dow !== 0 && dow !== 6 && !UK_BANK_HOLIDAYS.has(iso)) count++;
      }
      return count;
    }

    function fmt(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return '£' + Math.round(n).toLocaleString('en-GB');
    }
    function fmtPct(sales, gp) {
      if (!sales || sales === 0) return '—';
      return Math.round((gp / sales) * 100) + '%';
    }
    function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }

    async function odoo(model, method, args, kwargs) {
      const res = await fetch('/.netlify/functions/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, method, args: args || [], kwargs: kwargs || {} })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(JSON.stringify(data.error || data));
      return data.result;
    }

    async function load() {
      var today      = todayStr();
      var monthStart = monthStartStr();
      var wDays      = workingDaysInMonth();
      var dailySales = MONTHLY_SALES_TARGET / wDays;
      var dailyGP    = MONTHLY_GP_TARGET / wDays;

      var now = new Date();
      document.getElementById('date-line').textContent =
        now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

      initDials();
      set('gppct-today','—'); set('gppct-mtd','—'); set('gppct-inv','—');

      var status = document.getElementById('status-bar');
      status.className = 'status-bar';

      try {
        // ── Orders MTD (confirmed sales orders) ─────────────────────────
        status.textContent = 'Loading orders...';

        var orderLines = await odoo('sale.order.line', 'search_read',
          [[['order_id.state','=','sale'],
            ['order_id.date_order','>=', monthStart + ' 00:00:00'],
            ['order_id.date_order','<=', today + ' 23:59:59']]],
          { fields: ['order_id', 'price_subtotal', 'purchase_price', 'product_uom_qty', 'order_id'] }
        );

        // Get order dates
        var orderIds = [...new Set(orderLines.map(l => l.order_id[0]))];
        var orders = await odoo('sale.order', 'search_read',
          [[['id','in', orderIds]]],
          { fields: ['id', 'date_order'] }
        );
        var orderDateMap = {};
        orders.forEach(o => { orderDateMap[o.id] = o.date_order.split(' ')[0]; });

        var salesToday = 0, costToday = 0, salesMtd = 0, costMtd = 0;
        orderLines.forEach(function(line) {
          var orderId = line.order_id[0];
          var date = orderDateMap[orderId] || '';
          var rev  = line.price_subtotal || 0;
          var cost = (line.purchase_price || 0) * (line.product_uom_qty || 0);
          salesMtd += rev; costMtd += cost;
          if (date === today) { salesToday += rev; costToday += cost; }
        });

        var gpToday = salesToday - costToday;
        var gpMtd   = salesMtd - costMtd;

        setDial('dw-st', '#E8500A', salesToday, dailySales);
        setDial('dw-sm', '#E8500A', salesMtd,   MONTHLY_SALES_TARGET);
        setDial('dw-gt', '#A0A0A0', gpToday,    dailyGP);
        setDial('dw-gm', '#A0A0A0', gpMtd,      MONTHLY_GP_TARGET);
        set('gppct-today', fmtPct(salesToday, gpToday));
        set('gppct-mtd',   fmtPct(salesMtd,   gpMtd));

        // ── Invoices MTD ─────────────────────────────────────────────────
        status.textContent = 'Loading invoices...';

        var invoices = await odoo('account.move', 'search_read',
          [[['move_type','in',['out_invoice','out_refund']],
            ['state','=','posted'],
            ['invoice_date','>=', monthStart],
            ['invoice_date','<=', today]]],
          { fields: ['move_type', 'amount_untaxed', 'invoice_origin'] }
        );

        var salesInv = 0;
        var invoiceOrigins = [];
        invoices.forEach(function(inv) {
          var amt = inv.amount_untaxed || 0;
          if (inv.move_type === 'out_invoice') { salesInv += amt; if (inv.invoice_origin) invoiceOrigins.push(inv.invoice_origin); }
          else if (inv.move_type === 'out_refund') { salesInv -= amt; }
        });

        // Get GP from linked sale orders
        var gpInv = 0;
        if (invoiceOrigins.length > 0) {
          var linkedOrders = await odoo('sale.order', 'search_read',
            [[['name','in', invoiceOrigins]]],
            { fields: ['name', 'margin'] }
          );
          linkedOrders.forEach(o => { gpInv += (o.margin || 0); });
        }

        setDial('dw-si', '#E8500A', salesInv, MONTHLY_SALES_TARGET);
        setDial('dw-gi', '#A0A0A0', gpInv,    MONTHLY_GP_TARGET);
        set('gppct-inv', fmtPct(salesInv, gpInv));

        status.textContent = 'Last updated: ' + now.toLocaleTimeString('en-GB');

      } catch(err) {
        console.error(err);
        status.className = 'status-bar error';
        status.textContent = 'Error: ' + (err.message || String(err));
      }
    }

    async function handleRefresh() {
      var btn = document.getElementById('refresh-btn');
      btn.disabled = true; btn.textContent = '⏳ Loading…';
      await load();
      btn.disabled = false; btn.textContent = '↻ Refresh';
    }
  </script>
</body>
</html>
