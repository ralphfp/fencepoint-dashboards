<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fencepoint — Customer Spend Grid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;font-size:13px;padding-bottom:0}
h1{font-size:17px;font-weight:500;color:#1a1a18}
.sub{font-size:11px;color:#888780;margin-top:2px}

/* ── Fencepoint header ── */
.site-header{background:#fff;border-bottom:4px solid #F37032;padding:14px 20px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:0}
.site-header-logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.site-header-logo img{height:38px;width:auto;display:block}
.site-header-subtitle{font-size:10px;font-weight:700;color:#F37032;letter-spacing:1.5px;text-transform:uppercase}

.page{padding:14px 16px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ctrl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.modetogw{display:flex;border:0.5px solid #b4b2a9;border-radius:7px;overflow:hidden;background:#fff}
.modetog{font-size:12px;font-weight:500;padding:5px 13px;cursor:pointer;border:none;background:transparent;color:#5f5e5a;transition:background .12s}
.modetog.on{background:#1a1a18;color:#fff}
.stogw{display:flex;border:0.5px solid #b4b2a9;border-radius:7px;overflow:hidden;margin-left:2px}
.stog{font-size:11px;padding:4px 9px;cursor:pointer;border:none;background:transparent;color:#5f5e5a;display:flex;align-items:center;gap:3px}
.stog.on{background:#f1efe8;font-weight:500;color:#1a1a18}
.stog.on-ok{background:#D5F5E3;color:#1E8449;font-weight:500}
.stog.on-w{background:#FAEEDA;color:#854F0B;font-weight:500}
.stog.on-r{background:#FCEBEB;color:#A32D2D;font-weight:500}
select,input[type=text]{font-size:12px;padding:3px 6px;height:28px;border:0.5px solid #b4b2a9;border-radius:5px;background:#fff;color:#1a1a18}
input[type=text]{width:110px}
.fs{background:#fff;border:0.5px solid #d3d1c7;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fs-sep{width:0.5px;height:20px;background:#d3d1c7;margin:0 4px}
.fs h2{font-size:10px;font-weight:500;color:#888780;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.fs input[type=number]{font-size:12px;padding:3px 6px;height:28px;width:78px;border:0.5px solid #b4b2a9;border-radius:5px;background:#fff}
.fs input[type=date]{font-size:12px;padding:3px 6px;height:28px;border:0.5px solid #b4b2a9;border-radius:5px;background:#fff}
.fs label{font-size:11px;color:#5f5e5a}
.prbtn{display:flex;gap:4px;flex-wrap:wrap}
.prbtn button{font-size:11px;padding:3px 8px;height:26px;border:0.5px solid #b4b2a9;background:#fff;border-radius:5px;cursor:pointer;color:#5f5e5a}
.prbtn button.act{background:#1a1a18;color:#fff;border-color:#1a1a18}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:12px}
.kpi{background:#fff;border-radius:7px;padding:8px 12px;border:0.5px solid #d3d1c7}
.kpi-l{font-size:10px;color:#888780;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.kpi-v{font-size:20px;font-weight:500;color:#1a1a18;line-height:1.2}
.kpi-s{font-size:10px;color:#b4b2a9;margin-top:1px}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#888780;margin-bottom:6px;align-items:center}
.sw{width:13px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:2px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:4px;border:2.5px solid;flex-shrink:0}
.dot-ok{background:#27AE60;border-color:#1a7d44}
.dot-w{background:#E67E22;border-color:#b86018}
.dot-r{background:#E74C3C;border-color:#a93226}
/* KEY FIX: no max-height, overflow-x only so page scrolls naturally */
.scroll{overflow-x:auto;border:0.5px solid #d3d1c7;border-radius:8px;background:#fff}
table{border-collapse:collapse;font-size:12px;min-width:100%}
thead th{position:sticky;top:0;z-index:3;background:#fff;border-bottom:0.5px solid #d3d1c7;white-space:nowrap;padding:5px 8px;font-size:10px;font-weight:500;color:#888780;text-align:right}
thead th.cn{text-align:left;position:sticky;left:0;z-index:5;background:#fff;width:172px;min-width:172px;border-right:0.5px solid #d3d1c7}
thead th.csp{text-align:left;width:84px;min-width:84px}
thead th.ci{text-align:center;width:34px;min-width:34px;border-left:0.5px solid #d3d1c7}
thead th.ct{background:#f1efe8;border-left:0.5px solid #b4b2a9;font-weight:500;min-width:74px}
thead th.cyoy{background:#f1efe8;border-left:0.5px solid #b4b2a9;min-width:62px;position:sticky;right:0;z-index:4}
tbody tr.cur{border-bottom:none}
tbody tr.py{border-bottom:0.5px solid #d3d1c7}
td{padding:4px 8px;text-align:right;white-space:nowrap;min-width:68px;color:#1a1a18;font-size:12px}
td.cn{text-align:left;position:sticky;left:0;z-index:2;background:#fff;width:172px;min-width:172px;max-width:172px;overflow:hidden;text-overflow:ellipsis;border-right:0.5px solid #d3d1c7;font-weight:500;cursor:pointer;user-select:none}
td.cn:hover{text-decoration:underline;background:#fafaf8}
td.cn-py{text-align:left;position:sticky;left:0;z-index:2;background:#fff;width:172px;min-width:172px;border-right:0.5px solid #d3d1c7;font-size:11px;color:#888780;padding:2px 8px 4px 20px}
td.csp{text-align:left;font-size:11px;color:#5f5e5a;width:84px;min-width:84px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.csp-py{width:84px;min-width:84px}
td.ci{text-align:center;border-left:0.5px solid #d3d1c7;font-size:11px;color:#888780;min-width:34px}
td.ci-py{text-align:center;border-left:0.5px solid #d3d1c7;min-width:34px}
td.em{color:#b4b2a9;font-size:11px}
td.hv{cursor:pointer}
td.py-cell{font-size:11px;color:#444441}
td.em-py{font-size:11px;color:#d3d1c7}
td.ct{background:#f1efe8!important;font-weight:500;border-left:0.5px solid #b4b2a9;text-align:right;min-width:74px}
td.ct-py{background:#f1efe8!important;font-size:11px;color:#888780;border-left:0.5px solid #b4b2a9;text-align:right;min-width:74px}
td.cyoy{position:sticky;right:0;z-index:2;border-left:0.5px solid #b4b2a9;font-size:11px;font-weight:500;min-width:62px;text-align:center;background:#f1efe8!important}
td.cyoy-blank{position:sticky;right:0;z-index:2;border-left:0.5px solid #b4b2a9;background:#f1efe8!important;min-width:62px}
.up{color:#1E8449}.dn{color:#A32D2D}.flat{color:#888780}
.h1{background:#D5F5E3;color:#1E8449}.h2{background:#A9DFBF;color:#145A32}.h3{background:#85B7EB;color:#042C53}.h4{background:#378ADD;color:#fff}.h5{background:#185FA5;color:#fff}.h6{background:#0C447C;color:#fff}.neg{background:#FADBD8;color:#922B21}
.p1{background:#EEF9F4;color:#2E7D52}.p2{background:#D4EFE3;color:#1a5c38}.p3{background:#C5DCEF;color:#0a3a60}.p4{background:#9DC4E8;color:#042C53}.p5{background:#6FA4D4;color:#fff}.p6{background:#3D7AB5;color:#fff}.pn{background:#FDF0EF;color:#7a2920}
.tf td{background:#f1efe8!important;font-weight:500;font-size:11px;border-top:0.5px solid #b4b2a9;position:sticky;bottom:0;z-index:2}
.tf td.cn{position:sticky;left:0;z-index:4;background:#f1efe8!important}
.tf td.cyoy{position:sticky;right:0;z-index:4}
.tf td.ct{position:sticky;z-index:3}
.tt{position:fixed;background:#fff;border:0.5px solid #b4b2a9;border-radius:8px;padding:7px 11px;font-size:12px;color:#1a1a18;pointer-events:none;z-index:9999;display:none;min-width:160px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* KEY FIX: no overflow:hidden so chart never clips */
.ddp{border:0.5px solid #d3d1c7;border-radius:8px;margin-top:12px;background:#fff}
.ddh{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:0.5px solid #d3d1c7;background:#f1efe8;border-radius:8px 8px 0 0}
.ddh h3{font-size:13px;font-weight:500;color:#1a1a18}
.ddc{background:none;border:none;cursor:pointer;font-size:18px;color:#888780;line-height:1;padding:0 2px}
.ddb{padding:10px 14px 48px}
.ddsub{font-size:10px;font-weight:500;color:#888780;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.callbox{background:#f1efe8;border-radius:6px;padding:7px 10px;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;display:inline-block}
.badge-live{background:#D5F5E3;color:#1a7d44}
.badge-orders{background:#E8F4FD;color:#1a5c8a}
.loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;gap:10px;color:#888780;font-size:12px}
.spinner{width:22px;height:22px;border:2px solid #d3d1c7;border-top-color:#F37032;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#FCEBEB;border:0.5px solid #e5b4b4;border-radius:8px;padding:12px 16px;font-size:12px;color:#A32D2D;margin-bottom:12px}
</style>
</head>

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getVisMonths(fromStr, toStr){
  const from=new Date(fromStr), to=new Date(toStr), months=[];
  let y=from.getFullYear(), m=from.getMonth()+1;
  while(true){
    const ms=new Date(y,m-1,1), me=new Date(y,m,0);
    if(ms>to) break;
    if(me>=from) months.push({year:y,month:m});
    m++; if(m>12){m=1;y++;}
    if(months.length>60) break;
  }
  return months;
}
function getPriorMonths(vm){ return vm.map(({year,month})=>({year:year-1,month})); }
function priorDateRange(fromStr, toStr){
  const f=new Date(fromStr), t=new Date(toStr);
  const pf=new Date(f.getFullYear()-1,f.getMonth(),f.getDate());
  const pt=new Date(t.getFullYear()-1,t.getMonth(),t.getDate());
  return {from:pf.toISOString().slice(0,10), to:pt.toISOString().slice(0,10)};
}
function monthKey(year,month){ return year*100+month; }

const fmt=n=>n<0?'-£'+Math.abs(Math.round(n)).toLocaleString('en-GB'):n>=10000?'£'+(n/1000).toFixed(0)+'k':n>=1000?'£'+(n/1000).toFixed(1)+'k':'£'+Math.round(n);

const hc=v=>!v||v===0?'':v<0?'neg':v<500?'h1':v<1000?'h2':v<3000?'h3':v<8000?'h4':v<15000?'h5':'h6';

const daysSince=s=>s?Math.round((TODAY-new Date(s))/86400000):999;
const daysSinceDate=s=>s?Math.round((new Date()-new Date(s))/86400000):999;

function buildCusts(raw, visMonths){
  const map={};
  const vmKeys=new Set(visMonths.map(v=>monthKey(v.year,v.month)));
  raw.forEach(row=>{
    let pid,name,yr,mo,tot,cnt;
    if(row.length===6){[pid,name,yr,mo,tot,cnt]=row;}
    else{[pid,yr,mo,tot,cnt]=row; name=null;}
    const k=monthKey(+yr,+mo);
    if(!vmKeys.has(k)) return;
    const npid=+pid;
    const resolvedName=name||nameCache[npid]||('Customer '+npid);
    if(name) nameCache[npid]=name;
    if(!map[npid]) map[npid]={pid:npid,name:resolvedName,monthly:{},total:0,invCount:0};
    map[npid].monthly[k]=(map[npid].monthly[k]||0)+(+tot);
    map[npid].total+=(+tot);
    map[npid].invCount+=(+cnt);
  });
  return Object.values(map);
}

function scoreCustomer(c, visMonths){
  const mVals=visMonths.map(({year,month})=>c.monthly[monthKey(year,month)]||0);
  const activeMonths=visMonths.filter(({year,month})=>(c.monthly[monthKey(year,month)]||0)>0);
  const n=visMonths.length;
  const splitA=Math.max(1,Math.round(n*0.4));
  const early=mVals.slice(0,splitA), recent=mVals.slice(-splitA);
  const earlyAvg=early.reduce((a,b)=>a+b,0)/splitA;
  const recentAvg=recent.reduce((a,b)=>a+b,0)/splitA;
  const spendDrop=earlyAvg>200?(earlyAvg-recentAvg)/earlyAvg:0;
  let slope=0;
  if(n>1){
    const xm=(n-1)/2, ym=mVals.reduce((a,b)=>a+b,0)/n;
    let num=0,den=0;
    mVals.forEach((v,i)=>{num+=(i-xm)*(v-ym);den+=(i-xm)**2;});
    slope=den>0?(ym>0?(num/den)/ym:0):0;
  }
  const earlyActive=visMonths.slice(0,splitA).filter(({year,month})=>(c.monthly[monthKey(year,month)]||0)>0);
  const recentActive=visMonths.slice(-splitA).filter(({year,month})=>(c.monthly[monthKey(year,month)]||0)>0);
  const earlyFreq=earlyActive.length/splitA, recentFreq=recentActive.length/splitA;
  const freqDrop=earlyFreq>0?(earlyFreq-recentFreq)/earlyFreq:0;
  let gapScore=0;
  if(activeMonths.length>=2){
    const keys=activeMonths.map(({year,month})=>year*12+month);
    const gaps=[]; for(let i=1;i<keys.length;i++) gaps.push(keys[i]-keys[i-1]);
    const typicalGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const lastKey=keys[keys.length-1];
    const curKey=visMonths[visMonths.length-1].year*12+visMonths[visMonths.length-1].month;
    gapScore=typicalGap>0?Math.max(0,(curKey-lastKey+(TODAY.getDate()/30)-typicalGap)/typicalGap):0;
  } else if(activeMonths.length===1){
    const lk=activeMonths[0].year*12+activeMonths[0].month;
    const ck=visMonths[visMonths.length-1].year*12+visMonths[visMonths.length-1].month;
    gapScore=(ck-lk+(TODAY.getDate()/30))>1.5?1:0;
  }
  const signals=[]; let score=0;
  if(spendDrop>0.5||slope<-0.25){score+=2;signals.push('Spend down '+(spendDrop>0?Math.round(spendDrop*100)+'%':'↓'));}
  else if(spendDrop>0.25||slope<-0.1){score+=1;signals.push('Spend softening');}
  if(freqDrop>0.5){score+=2;signals.push('Order freq −'+Math.round(freqDrop*100)+'%');}
  else if(freqDrop>0.25){score+=1;signals.push('Ordering less often');}
  if(gapScore>1.0){score+=2;signals.push('Gap '+(Math.round((gapScore+1)*10)/10)+'× normal');}
  else if(gapScore>0.4){score+=1;signals.push('Gap longer than usual');}
  if(activeMonths.length<=2) score=Math.min(score,2);
  return {st:score>=4?'r':score>=2?'w':'ok', signals, score};
}

// ── Fetch via Netlify functions ───────────────────────────────────────────
async function fetchData(fromStr, toStr, mode){
  const cacheKey=mode+'|'+fromStr+'|'+toStr;
  if(dataCache[cacheKey]) return dataCache[cacheKey];
  const py=priorDateRange(fromStr,toStr);
  const res=await fetch('/.netlify/functions/customer-spend-query',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fromStr,toStr,priorFrom:py.from,priorTo:py.to,mode})
  });
  if(!res.ok) throw new Error('Query failed: '+res.status);
  const data=await res.json();
  if(data.error) throw new Error(data.error);
  // Resolve partner names from returned data
  if(data.current) data.current.forEach(r=>{ if(r.length===6&&r[1]) nameCache[+r[0]]=r[1]; });
  if(data.prior)   data.prior.forEach(r=>{ if(r.length===6&&r[1]) nameCache[+r[0]]=r[1]; });
  dataCache[cacheKey]=data;
  return data;
}

async function fetchDrillData(pid, fromStr, toStr){
  const cacheKey='drill|'+pid+'|'+fromStr+'|'+toStr;
  if(drillCache[cacheKey]) return drillCache[cacheKey];
  const py=priorDateRange(fromStr,toStr);
  const res=await fetch('/.netlify/functions/customer-spend-drill',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pid:+pid,fromStr,toStr,priorFrom:py.from,priorTo:py.to})
  });
  if(!res.ok) throw new Error('Drill query failed: '+res.status);
  const data=await res.json();
  if(data.error) throw new Error(data.error);
  drillCache[cacheKey]=data;
  return data;
}

function renderCallsHtml(calls){
  if(!calls||calls.length===0) return `<div class="callbox" style="background:#FCEBEB"><span class="dot dot-r" style="flex-shrink:0"></span><div style="color:#A32D2D;font-weight:500">No calls logged on record</div></div>`;
  const latest=calls[0];
  const ds=daysSinceDate(latest[0]);
  const dotCls=ds>30?'dot-r':ds>14?'dot-w':'dot-ok';
  const dateColor=ds>30?'color:#A32D2D':ds>14?'color:#854F0B':'color:#1E8449';
  let h=`<div class="callbox"><span class="dot ${dotCls}" style="flex-shrink:0"></span><div style="flex:1"><div style="font-weight:500">Last call: <span style="${dateColor}">${fmtDate(latest[0])}</span> <span style="font-size:10px;color:#888780;font-weight:400">${latest[1]||''}</span> <span style="font-size:10px;color:#b4b2a9">${ds} days ago</span></div>`;
  if(latest[2]) h+=`<div style="font-size:11px;color:#5f5e5a;margin-top:2px;font-style:italic">"${(latest[2]||'').slice(0,160)}${(latest[2]||'').length>160?'...':''}"</div>`;
  h+=`</div></div>`;
  if(calls.length>1){
    h+=`<div style="font-size:11px;color:#888780;margin-top:4px">`;
    calls.slice(1).forEach(c=>{
      h+=`<div style="padding:2px 0;border-top:0.5px solid #f0eeea;margin-top:3px"><span style="color:#5f5e5a;font-weight:500">${fmtDate(c[0])}</span> <span style="color:#b4b2a9">${c[1]||''}</span>${c[2]?` — <span style="font-style:italic">"${(c[2]||'').slice(0,100)}${(c[2]||'').length>100?'...':''}"</span>`:''}</div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderCategoryHtml(catCurrent, catPrior, riskStatus){
  if(!catCurrent||catCurrent.length===0) return `<div style="font-size:11px;color:#b4b2a9;padding:6px 0">No category data for this period.</div>`;
  const curMap={}, pyMap={};
  catCurrent.forEach(([cat,tot])=>{ curMap[cat]=+tot; });
  (catPrior||[]).forEach(([cat,tot])=>{ pyMap[cat]=+tot; });
  const allCats=[...new Set([...Object.keys(curMap),...Object.keys(pyMap)])];
  allCats.sort((a,b)=>(curMap[b]||0)-(curMap[a]||0));
  const maxVal=Math.max(...allCats.map(c=>Math.max(curMap[c]||0,pyMap[c]||0)),1);
  const barW=300;
  let h=`<div style="margin-top:10px"><div class="ddsub">Spend by category</div>`;
  h+=`<div style="display:flex;gap:12px;font-size:10px;color:#888780;margin-bottom:8px"><span><span style="display:inline-block;width:10px;height:10px;background:#378ADD;border-radius:2px;margin-right:3px;vertical-align:middle"></span>Current</span><span><span style="display:inline-block;width:10px;height:10px;background:#d3d1c7;border-radius:2px;margin-right:3px;vertical-align:middle"></span>Prior year</span></div>`;
  allCats.forEach(cat=>{
    const cur=curMap[cat]||0, py=pyMap[cat]||0;
    const curBar=Math.round((cur/maxVal)*barW), pyBar=Math.round((py/maxVal)*barW);
    const yoy=py>0?Math.round((cur-py)/py*100):null;
    const yoyColor=yoy===null?'#888780':yoy>=0?'#1E8449':'#A32D2D';
    const yoyStr=yoy===null?'new':yoy>=0?'+'+yoy+'%':yoy+'%';
    h+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:11px;font-weight:500;color:#1a1a18">${cat}</span><span style="font-size:10px"><span style="color:#1a1a18">${fmtF(Math.round(cur))}</span> <span style="color:${yoyColor};font-weight:500;margin-left:4px">${yoyStr}</span></span></div><div style="background:#f1efe8;border-radius:3px;height:7px;width:${barW}px;position:relative"><div style="background:#d3d1c7;height:7px;width:${pyBar}px;border-radius:3px;position:absolute;top:0;left:0"></div><div style="background:#378ADD;height:7px;width:${curBar}px;border-radius:3px;position:absolute;top:0;left:0"></div></div></div>`;
  });
  h+=`</div>`;
  if(riskStatus==='r'||riskStatus==='w'){
    const dropped=Object.keys(pyMap).filter(cat=>!curMap[cat]||curMap[cat]<pyMap[cat]*0.2);
    if(dropped.length>0){
      h+=`<div style="margin-top:10px;padding:8px 10px;background:#FCEBEB;border-radius:6px;border-left:3px solid #E74C3C"><div style="font-size:10px;font-weight:500;color:#A32D2D;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Categories dropped off</div>`;
      dropped.forEach(cat=>{
        const pv=pyMap[cat], cv=curMap[cat]||0;
        h+=`<div style="font-size:11px;color:#5f5e5a;padding:2px 0"><b style="color:#1a1a18">${cat}</b> — ${cv===0?`Gone — was ${fmtF(Math.round(pv))}`:`Down ${Math.round((1-cv/pv)*100)}% (${fmtF(Math.round(cv))} vs ${fmtF(Math.round(pv))})`}</div>`;
      });
      h+=`</div>`;
    }
  }
  return h;
}

async function render(){
  const fromStr=document.getElementById('dateFrom').value||'2026-01-01';
  const toStr=document.getElementById('dateTo').value||todayStr();
  const visMonths=getVisMonths(fromStr,toStr);
  const priorMonths=getPriorMonths(visMonths);
  const ms=parseFloat(document.getElementById('ms').value)||0;
  const sr=(document.getElementById('sr').value||'').toLowerCase();
  const spf=document.getElementById('spFilter').value;

  showLoading(viewMode==='invoiced'?'Fetching invoices from Odoo…':'Fetching orders from Odoo…');

  let raw26, raw25;
  try{
    const fetched=await fetchData(fromStr,toStr,viewMode);
    raw26=fetched.current||[]; raw25=fetched.prior||[];
    // Populate SP from live Odoo salesperson data
    const spMap=fetched.spMap||{};
    Object.keys(spMap).forEach(pid=>{ SP[+pid]=spMap[pid]; });
  }catch(e){ showError(e.message); return; }

  let custs=buildCusts(raw26,visMonths).filter(c=>
    c.total>=ms && (!sr||c.name.toLowerCase().includes(sr)) && (!spf||(SP[c.pid]||'')===spf)
  );
  custs.sort((a,b)=>b.total-a.total);

  const pyMap={};
  buildCusts(raw25,priorMonths).forEach(x=>{ pyMap[+x.pid]=x; });
  custs.forEach(c=>{
    const py=pyMap[+c.pid];
    c.pyTotal=py?py.total:0; c.pyMonthly=py?py.monthly:{};
    const {st,signals,score}=scoreCustomer(c,visMonths);
    c.st=st; c.signals=signals; c.score=score;
  });
  if(sf!=='all') custs=custs.filter(c=>c.st===sf);

  const totals={};
  visMonths.forEach(vm=>{
    const k=monthKey(vm.year,vm.month);
    totals[k]=custs.reduce((s,c)=>s+(c.monthly[k]||0),0);
  });
  const grand=custs.reduce((s,c)=>s+c.total,0);
  const grand25=custs.reduce((s,c)=>s+c.pyTotal,0);
  const totalTx=custs.reduce((s,c)=>s+c.invCount,0);
  const yoyPct=grand25>0?Math.round((grand-grand25)/grand25*100):null;

  const startYM=visMonths[0], endYM=visMonths[visMonths.length-1];
  const mLabel=startYM.year===endYM.year
    ?MN[startYM.month-1]+(startYM.month!==endYM.month?'–'+MN[endYM.month-1]:'')+' '+startYM.year
    :MN[startYM.month-1]+' '+startYM.year+' – '+MN[endYM.month-1]+' '+endYM.year;
  const modeLabel=viewMode==='orders'?'Sales & POS orders':'Net invoiced (product lines)';
  const txLabel=viewMode==='orders'?'Orders':'Invoices';
  const pyLabel=`${MN[priorMonths[0].month-1]} ${priorMonths[0].year}–${MN[priorMonths[priorMonths.length-1].month-1]} ${priorMonths[priorMonths.length-1].year}`;

  document.getElementById('subtitle').textContent=`${modeLabel} · rent/rates excluded · ${mLabel} vs ${pyLabel} · sorted by spend`;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-l">Customers</div><div class="kpi-v">${custs.length}</div><div class="kpi-s">≥ ${fmtF(ms)}</div></div>
    <div class="kpi"><div class="kpi-l">${viewMode==='orders'?'Ordered':'Invoiced'} (current)</div><div class="kpi-v">${fmtF(grand)}</div><div class="kpi-s">${mLabel}</div></div>
    <div class="kpi"><div class="kpi-l">Prior year</div><div class="kpi-v">${fmtF(grand25)}</div><div class="kpi-s">${pyLabel}</div></div>
    <div class="kpi"><div class="kpi-l">YoY</div><div class="kpi-v" style="${yoyPct===null?'':yoyPct>=0?'color:#1E8449':'color:#A32D2D'}">${yoyPct===null?'—':(yoyPct>=0?'+':'')+yoyPct+'%'}</div><div class="kpi-s">vs same period</div></div>
    <div class="kpi"><div class="kpi-l">${txLabel}</div><div class="kpi-v">${totalTx.toLocaleString()}</div><div class="kpi-s">${txLabel.toLowerCase()}</div></div>
    <div class="kpi"><div class="kpi-l" style="color:#E74C3C">● At risk</div><div class="kpi-v" style="color:#E74C3C">${custs.filter(c=>c.st==='r').length}</div><div class="kpi-s">multi-factor</div></div>`;

  ensureGridTable();

  const colHeaders=visMonths.map(({year,month})=>`<th>${MN[month-1]} ${String(year).slice(2)}</th>`).join('');
  const thead=`<thead><tr><th class="cn">Customer</th><th class="csp">Salesperson</th><th class="ci">${txLabel.slice(0,3)}</th>${colHeaders}<th class="ct">Total</th><th class="cyoy">YoY</th></tr></thead>`;

  const rows=custs.map(c=>{
    const dcls=c.st==='r'?'dot dot-r':c.st==='w'?'dot dot-w':'dot dot-ok';
    const sp=SP[c.pid]||'—';
    const sigTip=c.signals&&c.signals.length?c.signals.join(' · '):'';
    const ul=openPid===c.pid?'text-decoration:underline':'';
    const cells=visMonths.map(({year,month})=>{
      const k=monthKey(year,month), v=c.monthly[k];
      if(!v||v===0) return`<td class="em">—</td>`;
      return`<td class="hv ${hc(v)}" data-n="${c.name.replace(/"/g,'&quot;')}" data-m="${MN[month-1]} ${year}" data-v="${fmtF(v)}">${fmt(v)}</td>`;
    }).join('');
    const pyRow=visMonths.map(({year,month},i)=>{
      const pm=priorMonths[i], k=pm?monthKey(pm.year,pm.month):null;
      const v=k?c.pyMonthly[k]:null;
      if(!v||v<=0) return`<td class="em-py">—</td>`;
      return`<td class="py-cell ${hcp(v)}" data-n="${c.name.replace(/"/g,'&quot;')}" data-m="${MN[pm.month-1]} ${pm.year}" data-v="${fmtF(v)}">${fmt(v)}</td>`;
    }).join('');
    const yoy=c.pyTotal>0?Math.round((c.total-c.pyTotal)/c.pyTotal*100):null;
    const yoyHtml=yoy===null?`<td class="cyoy flat">—</td>`:yoy>=0?`<td class="cyoy up">+${yoy}%</td>`:`<td class="cyoy dn">${yoy}%</td>`;
    return`<tr class="cur"><td class="cn" style="${ul}" onclick="toggleDrill(${c.pid})" title="${c.name}"><span class="${dcls}" title="${sigTip}"></span>${c.name}</td><td class="csp" title="${sp}">${sp}</td><td class="ci">${c.invCount}</td>${cells}<td class="ct">${fmtF(Math.round(c.total))}</td>${yoyHtml}</tr>`+
           `<tr class="py"><td class="cn-py">↳ prior year</td><td class="csp-py"></td><td class="ci-py"></td>${pyRow}<td class="ct-py">${c.pyTotal>0?fmtF(Math.round(c.pyTotal)):'—'}</td><td class="cyoy-blank"></td></tr>`;
  }).join('');

  const fCells=visMonths.map(({year,month})=>{
    const k=monthKey(year,month);
    return`<td class="${hc(totals[k])}" style="text-align:right;font-size:11px">${totals[k]>0?fmtF(Math.round(totals[k])):'—'}</td>`;
  }).join('');
  const yoyF=yoyPct===null?'—':yoyPct>=0?`<span class="up">+${yoyPct}%</span>`:`<span class="dn">${yoyPct}%</span>`;
  document.getElementById('grid').innerHTML=thead+`<tbody>${rows}</tbody><tfoot><tr class="tf"><td class="cn tf">Monthly total</td><td class="csp tf"></td><td class="ci tf"></td>${fCells}<td class="ct tf">${fmtF(Math.round(grand))}</td><td class="cyoy tf">${yoyF}</td></tr></tfoot>`;

  if(openPid) renderDrill(openPid,raw26,raw25,visMonths,priorMonths);

  document.querySelectorAll('td.hv,td.py-cell').forEach(td=>{
    if(!td.dataset.v) return;
    td.addEventListener('mouseenter',()=>{const t=document.getElementById('tt');t.innerHTML=`<b>${td.dataset.n}</b><br>${td.dataset.m}: <b>${td.dataset.v}</b>`;t.style.display='block';});
    td.addEventListener('mousemove',e=>{const t=document.getElementById('tt');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-8)+'px';});
    td.addEventListener('mouseleave',()=>{document.getElementById('tt').style.display='none';});
  });
}

function toggleDrill(pid){
  if(openPid===pid){
    openPid=null;
    document.getElementById('dd').innerHTML='';
    render(); return;
  }
  openPid=pid; render();
  const fromStr=document.getElementById('dateFrom').value||'2026-01-01';
  const toStr=document.getElementById('dateTo').value||todayStr();
  document.getElementById('dd').dataset.openPid=pid;
  loadDrillPanel(pid,fromStr,toStr);
}

async function loadDrillPanel(pid,fromStr,toStr){
  const panel=document.getElementById('dd');
  const body=panel.querySelector('.ddb');
  if(body){
    const catSection=body.querySelector('.drill-cat');
    const callSection=body.querySelector('.drill-calls');
    if(catSection) catSection.innerHTML=`<div style="font-size:11px;color:#888780;display:flex;align-items:center;gap:6px"><div class="spinner" style="width:14px;height:14px;border-width:1.5px"></div> Loading…</div>`;
    if(callSection) callSection.innerHTML=`<div class="ddsub">Recent calls</div><div style="font-size:11px;color:#888780;display:flex;align-items:center;gap:6px"><div class="spinner" style="width:14px;height:14px;border-width:1.5px"></div> Loading…</div>`;
  }
  try{
    const {calls,catCurrent,catPrior}=await fetchDrillData(+pid,fromStr,toStr);
    renderDrillFull(+pid,calls,catCurrent,catPrior);
  }catch(e){
    const body2=document.querySelector('#dd .ddb');
    if(body2){const ed=body2.querySelector('.drill-cat'); if(ed) ed.innerHTML=`<div style="font-size:11px;color:#A32D2D">Could not load detail: ${e.message}</div>`;}
  }
}

function renderDrill(pid,raw26,raw25,visMonths,priorMonths){
  const fromStr=document.getElementById('dateFrom').value||'2026-01-01';
  const toStr=document.getElementById('dateTo').value||todayStr();
  const vm=visMonths||getVisMonths(fromStr,toStr);
  const pm=priorMonths||getPriorMonths(vm);
  const raw=raw26||(dataCache[viewMode+'|'+fromStr+'|'+toStr]||{}).current||[];
  const rawPy=raw25||(dataCache[viewMode+'|'+fromStr+'|'+toStr]||{}).prior||[];
  const pyMap2={}; buildCusts(rawPy,pm).forEach(x=>{pyMap2[+x.pid]=x;});
  const c=buildCusts(raw,vm).find(x=>+x.pid===+pid);
  if(!c) return;
  const py=pyMap2[+pid]; c.pyTotal=py?py.total:0;
  const {st,signals}=scoreCustomer(c,vm);
  const sp=SP[+pid]||'—';
  const yoy=c.pyTotal>0?Math.round((c.total-c.pyTotal)/c.pyTotal*100):null;
  const yoyStr=yoy===null?'No prior year data':`vs ${fmtF(Math.round(c.pyTotal))} prior year — <b style="${yoy>=0?'color:#1E8449':'color:#A32D2D'}">${yoy>=0?'+':''}${yoy}% YoY</b>`;
  const sigHtml=signals&&signals.length
    ?`<div style="margin-top:6px;padding:7px 10px;background:#f1efe8;border-radius:6px;font-size:11px;color:#5f5e5a"><b style="color:#1a1a18">Risk signals:</b> ${signals.join(' &nbsp;·&nbsp; ')}</div>`
    :`<div style="margin-top:6px;padding:7px 10px;background:#D5F5E3;border-radius:6px;font-size:11px;color:#1E8449"><b>No risk signals</b> — patterns look healthy.</div>`;
  const txWord=viewMode==='orders'?'orders':'inv';
  const infoHtml=`<div style="font-size:12px;color:#5f5e5a;margin-bottom:8px;line-height:1.8"><span style="font-weight:500;color:#1a1a18">Salesperson:</span> ${sp} &nbsp;<span style="font-weight:500;color:#1a1a18">${txWord.charAt(0).toUpperCase()+txWord.slice(1)}:</span> ${c.invCount} &nbsp;<span>${yoyStr}</span></div>`;
  const sparkVals=vm.map(({year,month})=>c.monthly[monthKey(year,month)]||0);
  const sparkMax=Math.max(...sparkVals,1);
  const sparkW=Math.min(280,vm.length*36+20), sparkH=36;
  const pts=sparkVals.map((v,i)=>`${Math.round(i*(sparkW/(sparkVals.length-1||1)))},${Math.round(sparkH-(v/sparkMax)*(sparkH-4)+2)}`).join(' ');
  const sparkSvg=`<svg width="${sparkW}" height="${sparkH}" style="display:block"><polyline points="${pts}" fill="none" stroke="#F37032" stroke-width="1.5" stroke-linejoin="round"/>${sparkVals.map((v,i)=>`<circle cx="${Math.round(i*(sparkW/(sparkVals.length-1||1)))}" cy="${Math.round(sparkH-(v/sparkMax)*(sparkH-4)+2)}" r="2.5" fill="${hc(v)?'#F37032':'#d3d1c7'}"/>`).join('')}</svg>`;
  const monthLabels=`<div style="display:flex;justify-content:space-between;font-size:9px;color:#b4b2a9;width:${sparkW}px;margin-top:1px">${vm.map(({year,month})=>`<span>${MN[month-1]}</span>`).join('')}</div>`;
  const panel=document.getElementById('dd');
  panel.innerHTML=`<div class="ddp"><div class="ddh"><h3 class="drill-name">${c.name} — ${fmtF(Math.round(c.total))} · ${c.invCount} ${txWord} · ${sp}</h3><button class="ddc" onclick="toggleDrill(${pid})">×</button></div><div class="ddb">${infoHtml}${sigHtml}<div style="margin-top:8px"><div class="ddsub">Spend trend</div>${sparkSvg}${monthLabels}</div><div class="drill-calls" style="margin-top:10px"><div class="ddsub">Recent calls</div><div style="font-size:11px;color:#888780;display:flex;align-items:center;gap:6px"><div class="spinner" style="width:14px;height:14px;border-width:1.5px"></div> Loading…</div></div><div class="drill-cat" style="margin-top:2px"></div></div></div>`;
  panel.dataset.riskStatus=st;
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function renderDrillFull(pid,calls,catCurrent,catPrior){
  const panel=document.getElementById('dd');
  if(!panel||+panel.dataset.openPid!==+pid) return;
  const st=panel.dataset.riskStatus||'ok';
  const callsDiv=panel.querySelector('.drill-calls');
  const catDiv=panel.querySelector('.drill-cat');
  if(callsDiv) callsDiv.innerHTML=`<div class="ddsub">Recent calls</div>`+renderCallsHtml(calls);
  if(catDiv) catDiv.innerHTML=renderCategoryHtml(catCurrent,catPrior,st);
}

buildPresets();
document.getElementById('sfAll').className='stog on';
render();
</script>
</body>
</html>
