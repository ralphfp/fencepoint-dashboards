<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Call Report</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #f7f8fa; color: #111; min-height: 100vh; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─── Constants ─────────────────────────────────────────────────────────────────

const REPS = ["Ralph Lewis","Roger Lewis","Kayleigh Rankin","Daniel Wilkin","Amy Hope"];
const PROSPECTING_REPS = ["Ralph Lewis","Roger Lewis"];
const REP_CONFIG = {
  "Ralph Lewis":     { initials:"RL", bg:"#E6F1FB", color:"#0C447C" },
  "Roger Lewis":     { initials:"RL", bg:"#EEEDFE", color:"#3C3489" },
  "Kayleigh Rankin": { initials:"KR", bg:"#E1F5EE", color:"#085041" },
  "Daniel Wilkin":   { initials:"DW", bg:"#FAECE7", color:"#993C1D" },
  "Amy Hope":        { initials:"AH", bg:"#FAEEDA", color:"#854F0B" },
};
const ACTIVITY_MAP = {
  "Proactive Call":                "Proactive Call",
  "Opportunity Follow Up Call":    "Opp. Follow Up",
  "Commercial Brochure Follow Up": "Brochure F/U",
  "Quote Follow Up Call":          "Quote F/U",
  "Follow up call":                "Quote F/U",
  "Inbound Call":                  "Inbound Call",
};
const ACTIVITY_COLORS = {
  "Proactive Call": "#F37032",
  "Opp. Follow Up": "#72243E",
  "Brochure F/U":   "#0F6E56",
  "Quote F/U":      "#533FB7",
  "Inbound Call":   "#BA7517",
  "Prospecting":    "#888780",
};
const NO_ANSWER_PHRASES = [
  "no answer","not available","ringing out","left vm","voicemail",
  "out of office","not avialble","no available","no asnwer",
  "not in the office","no reply","straight to voicemail","left voicemail",
  "no nswer","rang out",
];

// ─── Helpers ───────────────────────────────────────────────────────────────────

function stripHtml(html="") {
  return html.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().toLowerCase();
}
function isNoAnswer(body) {
  const text = stripHtml(body);
  return NO_ANSWER_PHRASES.some(p => text.includes(p));
}
function dedup(rows) {
  const seen = new Set();
  return rows.filter(r => {
    const key = `${r.author}|${r.activity}|${r.date}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function toISODate(d) { return d.toISOString().slice(0,10); }
function nextDay(dateStr) {
  const d = new Date(dateStr+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+1);
  return toISODate(d);
}
function formatDate(d) {
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ─── State ─────────────────────────────────────────────────────────────────────

const today = toISODate(new Date());
const state = {
  stage: "idle",
  dateFrom: today,
  dateTo:   today,
  rawData: null,
  processed: null,
  activeRep: "All",
  logRep:    "All",
  prospecting:      { "Ralph Lewis":{total:0,connected:0}, "Roger Lewis":{total:0,connected:0} },
  prospectingDraft: { "Ralph Lewis":{total:0,connected:0}, "Roger Lewis":{total:0,connected:0} },
  businessData: null,
  error: "",
};

// ─── Data Fetching ─────────────────────────────────────────────────────────────

async function runQuery(sql) {
  const res = await fetch('/.netlify/functions/activity-query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql: sql })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('Query failed ' + res.status + ': ' + err);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.rows || [];
}

async function fetchOdooData(dateFrom, dateTo) {
  const d1 = nextDay(dateTo);
  const [callRows, orderRows, leadRows, actRows] = await Promise.all([
    runQuery(`SELECT [author_id_label],[mail_activity_type_id_label],[record_name],[body],[date] FROM [User].[Odoo].[mail_message] WHERE [mail_activity_type_id_label] IN ('Proactive Call','Commercial Brochure Follow Up','Opportunity Follow Up Call','Quote Follow Up Call','Inbound Call','Follow up call') AND [author_id_label] IN ('Ralph Lewis','Roger Lewis','Daniel Wilkin','Amy Hope','Kayleigh Rankin') AND [date] >= '${dateFrom}' AND [date] < '${d1}' LIMIT 500`),
    runQuery(`SELECT [id],[name],[state],[date_order],[user_id_label] FROM [User].[Odoo].[sale_order] WHERE [date_order] >= '${dateFrom}' AND [date_order] < '${d1}' LIMIT 500`),
    runQuery(`SELECT [id],[name],[stage_id_label],[create_date],[user_id_label],[probability] FROM [User].[Odoo].[crm_lead] WHERE [create_date] >= '${dateFrom}' AND [create_date] < '${d1}' LIMIT 500`),
    runQuery(`SELECT [user_id_label],[activity_type_id_label] FROM [User].[Odoo].[mail_activity] WHERE [user_id_label] IN ('Ralph Lewis','Roger Lewis','Daniel Wilkin','Amy Hope','Kayleigh Rankin') AND [date_deadline] <= '${dateTo}' LIMIT 1000`).catch(() => []),
  ]);
  return {
    calls: callRows.map(r => ({
      author:   r.author_id_label,
      activity: r.mail_activity_type_id_label,
      customer: r.record_name || "",
      body:     r.body || "",
      date:     r.date,
    })),
    saleOrders: orderRows.map(r => ({
      id: r.id, name: r.name, state: r.state,
      date_order: r.date_order, rep: r.user_id_label,
    })),
    crmLeads: leadRows.map(r => ({
      id: r.id, name: r.name, stage: r.stage_id_label,
      create_date: r.create_date, rep: r.user_id_label,
      probability: r.probability,
    })),
    activityRows: actRows,
  };
}

async function fetchBusinessData(dateTo) {
  const monthStart = dateTo.slice(0, 8) + '01';
  const d1 = nextDay(dateTo);
  const [todayOrders, mtdOrders, mtdGPRows, todayPOS] = await Promise.all([
    runQuery(`SELECT [team_id_label],[amount_untaxed],[partner_id_label] FROM [User].[Odoo].[sale_order] WHERE [date_order] >= '${dateTo}' AND [date_order] < '${d1}' AND [state] IN ('sale','done') LIMIT 500`).catch(() => []),
    runQuery(`SELECT [amount_untaxed] FROM [User].[Odoo].[sale_order] WHERE [date_order] >= '${monthStart}' AND [date_order] < '${d1}' AND [state] IN ('sale','done') LIMIT 2000`).catch(() => []),
    runQuery(`SELECT [User].[Odoo].[sale_order].[id],[User].[Odoo].[sale_order].[margin] FROM [User].[Odoo].[account_move] INNER JOIN [User].[Odoo].[sale_order] ON [User].[Odoo].[account_move].[invoice_origin] = [User].[Odoo].[sale_order].[name] WHERE [User].[Odoo].[account_move].[move_type] = 'out_invoice' AND [User].[Odoo].[account_move].[state] = 'posted' AND [User].[Odoo].[account_move].[invoice_date] >= '${monthStart}' AND [User].[Odoo].[account_move].[invoice_date] < '${d1}' LIMIT 2000`).catch(() => []),
    runQuery(`SELECT [amount_total],[amount_tax],[partner_id_label],[crm_team_id_label] FROM [User].[Odoo].[pos_order] WHERE [date_order] >= '${dateTo}' AND [date_order] < '${d1}' AND [crm_team_id_label] IN ('Timber','Commercial') AND [state] = 'invoiced' LIMIT 200`).catch(() => []),
  ]);

  const saleOrderKeys = new Set(
    todayOrders.map(r => `${r.team_id_label||''}|${r.partner_id_label||''}|${parseFloat(r.amount_untaxed||0).toFixed(2)}`)
  );

  let timberSaleTotal = 0, commercialSaleTotal = 0;
  for (const r of todayOrders) {
    const v = parseFloat(r.amount_untaxed||0);
    if ((r.team_id_label||'') === 'Timber') timberSaleTotal += v;
    else if ((r.team_id_label||'') === 'Commercial') commercialSaleTotal += v;
  }

  let timberPOSExtra = 0, commercialPOSExtra = 0;
  for (const po of todayPOS) {
    const exVat = parseFloat(po.amount_total||0) - parseFloat(po.amount_tax||0);
    const key = `${po.crm_team_id_label||''}|${po.partner_id_label||''}|${exVat.toFixed(2)}`;
    if (!saleOrderKeys.has(key)) {
      if ((po.crm_team_id_label||'') === 'Timber') timberPOSExtra += exVat;
      else if ((po.crm_team_id_label||'') === 'Commercial') commercialPOSExtra += exVat;
    }
  }

  const timberToday = timberSaleTotal + timberPOSExtra;
  const commercialToday = commercialSaleTotal + commercialPOSExtra;
  const mtdSales = mtdOrders.reduce((s,r) => s + parseFloat(r.amount_untaxed||0), 0);
  const seenIds = new Set();
  const mtdGP = mtdGPRows.reduce((s,r) => {
    if (!r.id || seenIds.has(r.id)) return s;
    seenIds.add(r.id);
    return s + parseFloat(r.margin||0);
  }, 0);
  return { timberToday, commercialToday, mtdSales, mtdGP };
}

// ─── Processing ────────────────────────────────────────────────────────────────

function processData(raw, prospecting) {
  const REP_SET = new Set(REPS);
  const calls = (raw.calls || []).map(r => ({
    ...r,
    activityDisplay: ACTIVITY_MAP[r.activity] || r.activity,
    noAnswer: isNoAnswer(r.body),
  }));
  const dedupedCalls = dedup(calls);

  const repData = {};
  for (const rep of REPS) {
    const repCalls = dedupedCalls.filter(r => r.author === rep);
    const byType = {};
    for (const c of repCalls) {
      const t = c.activityDisplay;
      if (!byType[t]) byType[t] = { total:0, connected:0, noAnswer:0 };
      byType[t].total++;
      if (c.noAnswer) byType[t].noAnswer++;
      else byType[t].connected++;
    }
    if (PROSPECTING_REPS.includes(rep) && prospecting[rep]) {
      const p = prospecting[rep];
      if (p.total > 0) byType["Prospecting"] = { total:p.total, connected:p.connected, noAnswer:p.total-p.connected };
    }
    const totalCalls     = Object.values(byType).reduce((s,v) => s+v.total, 0);
    const totalConnected = Object.values(byType).reduce((s,v) => s+v.connected, 0);
    const totalNoAnswer  = Object.values(byType).reduce((s,v) => s+v.noAnswer, 0);
    const repActs = (raw.activityRows || []).filter(r => r.user_id_label === rep);
    const outstanding = {
      total:     repActs.length,
      followUps: repActs.filter(r => {
        const t = (r.activity_type_id_label || '').toLowerCase();
        return t.includes('quote follow') || t.includes('opportunity follow');
      }).length,
    };
    repData[rep] = { byType, totalCalls, totalConnected, totalNoAnswer, outstanding };
  }

  const quotes       = (raw.saleOrders||[]).filter(o => o.state==="draft").length;
  const confirmed    = (raw.saleOrders||[]).filter(o => o.state==="sale").length;
  const opportunities = (raw.crmLeads||[]).filter(l => REP_SET.has(l.rep) && !l.name?.startsWith("FW:")).length;

  return { repData, quotes, confirmed, opportunities };
}

function getAllRows() {
  if (!state.processed || !state.rawData) return [];
  const base = (state.rawData.calls || []).map(r => ({
    ...r,
    activityDisplay: ACTIVITY_MAP[r.activity] || r.activity,
    noAnswer: isNoAnswer(r.body),
  }));
  const dedupedBase = dedup(base);
  const extraRows = [];
  for (const rep of PROSPECTING_REPS) {
    const p = state.prospecting[rep];
    if (!p || p.total === 0) continue;
    for (let i = 0; i < p.connected; i++)
      extraRows.push({ author:rep, activity:"Prospecting", activityDisplay:"Prospecting", body:"", date:"", noAnswer:false });
    for (let i = 0; i < p.total - p.connected; i++)
      extraRows.push({ author:rep, activity:"Prospecting", activityDisplay:"Prospecting", body:"", date:"", noAnswer:true });
  }
  return [...dedupedBase, ...extraRows];
}

// ─── HTML Builders ─────────────────────────────────────────────────────────────

function avatarHtml(rep, size=36) {
  const cfg = REP_CONFIG[rep] || { initials:"?", bg:"#eee", color:"#333" };
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${cfg.bg};color:${cfg.color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(size*0.38)}px;flex-shrink:0;border:2px solid ${cfg.color}22;">${cfg.initials}</div>`;
}

function repChipHtml(rep, data) {
  const cfg = REP_CONFIG[rep];
  const rate = data.totalCalls > 0 ? Math.round((data.totalConnected/data.totalCalls)*100) : 0;
  const sel = state.activeRep === rep;
  const out = data.outstanding || { total: 0, followUps: 0 };
  const outHtml = out.total > 0
    ? `<div style="font-size:10px;color:#888;margin-top:4px;padding-top:4px;border-top:1px solid #f0f0f0;"><span style="color:#43474F;font-weight:600;">${out.total}</span> outstanding &nbsp;·&nbsp; <span style="color:#F37032;font-weight:600;">${out.followUps}</span> quote/opp follow-ups</div>`
    : '';
  return `<div class="rep-chip" data-rep="${rep}" style="background:${sel?cfg.bg:'#fff'};border:2px solid ${sel?cfg.color:'#e5e7eb'};border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:${sel?`0 0 0 3px ${cfg.color}22`:'0 1px 4px #0001'};transition:all 0.15s;">
    ${avatarHtml(rep,44)}
    <div style="flex:1;">
      <div style="font-weight:700;font-size:14px;color:#111;">${rep}</div>
      <div style="font-size:12px;color:#666;margin-top:2px;">${data.totalCalls} calls · <span style="color:#1a7a4a;">${data.totalConnected}✓</span> / <span style="color:#c0392b;">${data.totalNoAnswer}✗</span></div>
      <div style="font-size:12px;font-weight:600;color:${cfg.color};margin-top:2px;">${rate}% connect</div>
      ${outHtml}
    </div>
  </div>`;
}

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return '£' + Math.round(n).toLocaleString('en-GB');
}

function businessPerfHtml(bd) {
  if (!bd) return '';
  const cards = [
    { label: 'Timber Sales Today',       value: fmt(bd.timberToday),     color: '#43474F' },
    { label: 'Commercial Sales Today',   value: fmt(bd.commercialToday), color: '#43474F' },
    { label: 'Combined Sales MTD',       value: fmt(bd.mtdSales),        color: '#F37032' },
    { label: 'Combined GP Invoiced MTD', value: fmt(bd.mtdGP),           color: '#1D9E75' },
  ].map(c => `<div style="flex:1;min-width:180px;background:#fff;border-radius:12px;padding:18px 20px;border:1.5px solid #f0f0f0;box-shadow:0 1px 6px #0001;"><div style="font-size:24px;font-weight:800;color:${c.color};">${c.value}</div><div style="font-size:11px;font-weight:600;color:#888;margin-top:5px;text-transform:uppercase;letter-spacing:0.5px;">${c.label}</div></div>`).join('');
  return `<div style="margin-bottom:20px;"><div style="font-size:12px;font-weight:700;color:#43474F;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Business Performance</div><div style="display:flex;gap:12px;flex-wrap:wrap;">${cards}</div></div>`;
}

function metricCardHtml(label, value, color) {
  return `<div style="background:#fff;border-radius:12px;padding:18px 20px;border:1.5px solid #f0f0f0;box-shadow:0 1px 6px #0001;flex:1;min-width:120px;"><div style="font-size:28px;font-weight:800;color:${color||'#111'};">${value}</div><div style="font-size:12px;color:#666;margin-top:4px;font-weight:600;">${label}</div></div>`;
}

function bizCardHtml(label, value, color) {
  return `<div style="flex:1;background:${color}12;border:2px solid ${color}33;border-radius:12px;padding:16px 20px;text-align:center;"><div style="font-size:32px;font-weight:800;color:${color};">${value}</div><div style="font-size:12px;font-weight:700;color:${color};margin-top:4px;">${label}</div></div>`;
}

function activityTableHtml(rows) {
  const types = [...new Set(rows.map(r=>r.activityDisplay))].sort();
  if (!types.length) return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;color:#aaa;font-size:13px;">No activity data.</div>`;
  const byType = {};
  for (const t of types) {
    const s = rows.filter(r=>r.activityDisplay===t);
    byType[t] = { total:s.length, connected:s.filter(r=>!r.noAnswer).length, noAnswer:s.filter(r=>r.noAnswer).length };
  }
  const max = Math.max(...Object.values(byType).map(v=>v.total), 1);
  const trs = types.map(t => {
    const v = byType[t]; const pct = (v.total/max)*100; const c = ACTIVITY_COLORS[t]||"#888";
    return `<tr style="border-top:1px solid #f5f5f5;"><td style="padding:7px 0;font-size:12px;display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block;flex-shrink:0;"></span>${t}</td><td style="padding:7px 4px;width:80px;"><div style="height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${c};border-radius:4px;"></div></div></td><td style="text-align:right;font-weight:700;font-size:12px;">${v.total}</td><td style="text-align:right;color:#1a7a4a;font-weight:600;font-size:12px;">${v.connected}</td><td style="text-align:right;color:#c0392b;font-weight:600;font-size:12px;">${v.noAnswer}</td></tr>`;
  }).join("");
  return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:14px;">Activity Breakdown</div><table style="width:100%;border-collapse:collapse;"><thead><tr style="color:#999;text-align:left;font-size:12px;"><th style="padding-bottom:8px;font-weight:600;">Type</th><th style="padding-bottom:8px;width:80px;"></th><th style="padding-bottom:8px;text-align:right;font-weight:600;">Total</th><th style="padding-bottom:8px;text-align:right;font-weight:600;color:#1a7a4a;">✓</th><th style="padding-bottom:8px;text-align:right;font-weight:600;color:#c0392b;">✗</th></tr></thead><tbody>${trs}</tbody></table></div>`;
}

function connectRateHtml(rows) {
  const types = [...new Set(rows.map(r=>r.activityDisplay))].sort();
  if (!types.length) return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;color:#aaa;font-size:13px;">No activity data.</div>`;
  const items = types.map(t => {
    const s = rows.filter(r=>r.activityDisplay===t);
    const pct = s.length > 0 ? Math.round((s.filter(r=>!r.noAnswer).length/s.length)*100) : 0;
    const color = pct >= 50 ? "#1a7a4a" : "#c0392b";
    return `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span style="color:#444;font-weight:600;">${t}</span><span style="font-weight:700;color:${color};">${pct}%</span></div><div style="height:10px;background:#f3f4f6;border-radius:5px;"><div style="height:100%;width:${pct}%;background:${color};border-radius:5px;"></div></div></div>`;
  }).join("");
  return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:14px;">Connect Rate by Type</div>${items}</div>`;
}

function barChartHtml(rows) {
  const types = [...new Set(rows.map(r=>r.activityDisplay))].sort();
  if (!types.length) return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;color:#aaa;font-size:13px;">No activity data.</div>`;
  const byType = {};
  for (const t of types) {
    const s = rows.filter(r=>r.activityDisplay===t);
    byType[t] = { connected:s.filter(r=>!r.noAnswer).length, noAnswer:s.filter(r=>r.noAnswer).length };
  }
  const max = Math.max(...Object.values(byType).map(v=>v.connected+v.noAnswer), 1);
  const BAR_H = 140;
  const bars = types.map(t => {
    const v = byType[t]; const total = v.connected+v.noAnswer;
    const cH = Math.max(2, Math.round((v.connected/max)*BAR_H));
    const nH = Math.max(v.noAnswer>0?2:0, Math.round((v.noAnswer/max)*BAR_H));
    const lbl = t.split(" ").map(w=>`<div>${w}</div>`).join("");
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="font-size:10px;font-weight:700;color:#555;">${total}</div><div style="display:flex;gap:3px;align-items:flex-end;height:${BAR_H}px;"><div style="width:18px;height:${cH}px;background:#F37032;border-radius:3px 3px 0 0;"></div><div style="width:18px;height:${nH}px;background:#E24B4A;border-radius:3px 3px 0 0;"></div></div><div style="font-size:10px;color:#888;text-align:center;line-height:1.3;margin-top:4px;">${lbl}</div></div>`;
  }).join("");
  return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;"><div style="display:flex;gap:16px;margin-bottom:14px;font-size:12px;"><span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;background:#F37032;border-radius:3px;display:inline-block;"></span>Connected</span><span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;background:#E24B4A;border-radius:3px;display:inline-block;"></span>No Answer</span></div><div style="display:flex;align-items:flex-end;gap:12px;height:${BAR_H+30}px;">${bars}</div></div>`;
}

function repComparisonHtml() {
  const reps = state.activeRep === "All" ? REPS : [state.activeRep];
  const items = reps.map(rep => {
    const d = state.processed.repData[rep];
    const cfg = REP_CONFIG[rep];
    const rate = d.totalCalls > 0 ? Math.round((d.totalConnected/d.totalCalls)*100) : 0;
    const color = rate >= 50 ? "#1a7a4a" : "#c0392b";
    return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">${avatarHtml(rep,32)}<div style="flex:1;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span style="font-weight:600;color:#333;">${rep.split(" ")[0]}</span><span style="font-weight:700;color:${color};">${rate}%</span></div><div style="height:8px;background:#f3f4f6;border-radius:4px;"><div style="height:100%;width:${rate}%;background:${cfg.color};border-radius:4px;"></div></div><div style="font-size:10px;color:#999;margin-top:2px;">${d.totalCalls} calls · ${d.totalConnected}✓ ${d.totalNoAnswer}✗</div></div></div>`;
  }).join("");
  return `<div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:14px;">Rep Comparison</div>${items}</div>`;
}

function prospectingInputsHtml(compact=false) {
  return PROSPECTING_REPS.map(rep => {
    const cfg = REP_CONFIG[rep];
    const vals = state.prospectingDraft[rep] || {total:0,connected:0};
    return `<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">${avatarHtml(rep, compact?28:32)}<span style="font-size:13px;font-weight:700;color:${cfg.color};">${rep}</span></div><div style="display:flex;gap:10px;">${['total','connected'].map(field => `<label style="flex:1;display:flex;flex-direction:column;gap:4px;"><span style="font-size:${compact?10:11}px;font-weight:600;color:${compact?'#aaa':'#888'};text-transform:uppercase;">${field==='total'?'Total':'Connected'}</span><input type="number" min="0" data-rep="${rep}" data-field="${field}" value="${vals[field]}" style="padding:${compact?'7px 10px':'10px 12px'};border:1.5px solid #e5e7eb;border-radius:8px;font-size:${compact?14:16}px;font-weight:700;width:100%;color:${cfg.color};outline:none;" /></label>`).join("")}</div></div>`;
  }).join(compact ? '' : '<div style="height:1px;background:#f0f0f0;margin:16px 0;"></div>');
}

function cleanNote(html) {
  if (!html) return '';
  const m = html.match(/Feedback:<\/div>\s*([\s\S]*?)(?=<\/div>|$)/i);
  if (m) {
    return m[1].replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
  }
  return html.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
}

function activityLogHtml() {
  if (!state.rawData) return '';
  const calls = dedup((state.rawData.calls || []).slice()).sort((a, b) => new Date(b.date) - new Date(a.date));
  const filtered = state.logRep === 'All' ? calls : calls.filter(c => c.author === state.logRep);

  const radios = ['All', ...REPS].map(rep => {
    const cfg = REP_CONFIG[rep];
    const checked = state.logRep === rep ? 'checked' : '';
    const active = state.logRep === rep;
    const dot = cfg ? `<span style="width:7px;height:7px;border-radius:50%;background:${cfg.color};flex-shrink:0;"></span>` : '';
    const label = rep === 'All' ? 'All' : rep.split(' ')[0];
    return `<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${active ? '#F37032' : '#e5e7eb'};color:${active ? '#F37032' : '#666'};background:${active ? '#fff8f4' : '#fff'};user-select:none;"><input type="radio" name="log-rep-filter" value="${rep}" ${checked} style="display:none;">${dot}${label}</label>`;
  }).join('');

  const rows = filtered.length === 0
    ? `<tr><td colspan="4" style="text-align:center;padding:28px;color:#bbb;font-size:13px;font-style:italic;">No activities recorded for this period</td></tr>`
    : filtered.map(c => {
        const cfg = REP_CONFIG[c.author] || { bg:'#eee', color:'#555', initials:'??' };
        const dispType = ACTIVITY_MAP[c.activity] || c.activity;
        const actColor = ACTIVITY_COLORS[dispType] || '#888';
        const note = cleanNote(c.body);
        const customer = c.customer || '';
        const noAns = isNoAnswer(c.body);
        const outcomeCell = noAns
          ? `<td style="padding:9px 12px;text-align:center;"><span style="font-size:15px;color:#e53e3e;font-weight:700;">✗</span></td>`
          : `<td style="padding:9px 12px;text-align:center;"><span style="font-size:15px;color:#1a7a4a;font-weight:700;">✓</span></td>`;
        const timeStr = c.date ? new Date(c.date).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
        return `<tr style="border-bottom:1px solid #f7f8fa;">${outcomeCell}<td style="padding:9px 12px;white-space:nowrap;font-size:12px;color:#aaa;">${timeStr}</td><td style="padding:9px 12px;white-space:nowrap;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:${cfg.color};"><span style="width:24px;height:24px;border-radius:50%;background:${cfg.bg};color:${cfg.color};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;">${cfg.initials}</span>${c.author.split(' ')[0]}</span></td><td style="padding:9px 12px;white-space:nowrap;"><span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:${actColor}1a;color:${actColor};">${dispType}</span></td><td style="padding:9px 12px;white-space:nowrap;font-size:12px;color:#43474F;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;">${customer || '<span style="color:#ccc;font-style:italic;">—</span>'}</td><td style="padding:9px 12px;font-size:12px;color:#444;line-height:1.5;max-width:400px;">${note || '<span style="color:#ccc;font-style:italic;">No note</span>'}</td></tr>`;
      }).join('');

  return `<div style="background:#fff;border-radius:12px;padding:20px 22px;border:1.5px solid #f0f0f0;box-shadow:0 1px 6px #0001;"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;"><div style="font-size:12px;font-weight:700;color:#43474F;letter-spacing:1px;text-transform:uppercase;">Activity Log<span style="font-size:11px;font-weight:500;color:#aaa;letter-spacing:0;text-transform:none;margin-left:8px;">${filtered.length} ${filtered.length === 1 ? 'entry' : 'entries'}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;">${radios}</div></div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:500px;"><thead><tr style="border-bottom:2px solid #f0f0f0;"><th style="text-align:left;padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap;">Time</th><th style="text-align:left;padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;">Rep</th><th style="padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;text-align:center;"></th><th style="text-align:left;padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;">Type</th><th style="text-align:left;padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;">Customer / Ref</th><th style="text-align:left;padding:6px 12px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.6px;">Note</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// ─── Main Render ───────────────────────────────────────────────────────────────

function render() {
  const allRows      = getAllRows();
  const filteredRows = state.activeRep === "All" ? allRows : allRows.filter(r => r.author === state.activeRep);
  const totalCalls     = filteredRows.length;
  const totalConnected = filteredRows.filter(r => !r.noAnswer).length;
  const totalNoAnswer  = filteredRows.filter(r =>  r.noAnswer).length;
  const connectRate    = totalCalls > 0 ? Math.round((totalConnected/totalCalls)*100) : 0;
  const activityTypes  = [...new Set(filteredRows.map(r => r.activityDisplay))].length;

  let displayDate = state.dateFrom === state.dateTo
    ? (() => { try { return formatDate(new Date(state.dateFrom+"T12:00:00")); } catch { return state.dateFrom; } })()
    : (() => { try { return formatDate(new Date(state.dateFrom+"T12:00:00")) + " - " + formatDate(new Date(state.dateTo+"T12:00:00")); } catch { return `${state.dateFrom} - ${state.dateTo}`; } })();

  const inputStyle = "padding:6px 10px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:12px;background:#f9fafb;color:#43474F;outline:none;cursor:pointer;";
  const labelStyle = "display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px;";

  const header = `<div style="background:#fff;color:#43474F;padding:16px 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:4px solid #F37032;box-shadow:0 2px 8px #00000014;"><div></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="font-weight:800;font-size:18px;color:#43474F;letter-spacing:0.5px;">FENCEPOINT</div><div style="font-size:11px;font-weight:700;color:#F37032;letter-spacing:1.5px;text-transform:uppercase;">Daily Call Report${state.stage==="dashboard" ? ` · ${displayDate}` : ''}</div></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;"><label style="${labelStyle}">From <input type="date" id="date-from" value="${state.dateFrom}" style="${inputStyle}" /></label><label style="${labelStyle}">To <input type="date" id="date-to" value="${state.dateTo}" style="${inputStyle}" /></label><button id="run-btn" style="padding:9px 20px;border-radius:8px;border:none;background:${state.stage==='loading'?'#c45e22':'#F37032'};color:#fff;font-weight:700;font-size:13px;cursor:${state.stage==='loading'?'wait':'pointer'};align-self:flex-end;letter-spacing:0.3px;">${state.stage==='loading' ? 'Loading...' : 'Run Report'}</button></div></div>`;

  let body = "";

  if (state.stage === "idle") {
    body = `<div style="text-align:center;padding:80px 20px;color:#94a3b8;"><div style="font-size:48px;margin-bottom:16px;">📊</div><div style="font-size:18px;font-weight:700;color:#475569;">Select a date and click Run Report</div><div style="font-size:13px;margin-top:8px;">Fetches call activity, quotes, and opportunities from Odoo</div></div>`;
  } else if (state.stage === "loading") {
    body = `<div style="text-align:center;padding:80px 20px;color:#94a3b8;"><div style="font-size:40px;margin-bottom:16px;display:inline-block;animation:spin 1.2s linear infinite;">⏳</div><div style="font-size:16px;font-weight:600;color:#475569;margin-top:8px;">Querying Odoo...</div><div style="font-size:12px;margin-top:8px;">Running call activity, sales orders, and opportunities queries</div></div>`;
  } else if (state.stage === "error") {
    body = `<div style="background:#fff1f1;border:2px solid #fca5a5;border-radius:12px;padding:24px;"><div style="font-weight:700;color:#b91c1c;margin-bottom:8px;">Error fetching data</div><div style="font-size:13px;color:#7f1d1d;white-space:pre-wrap;font-family:monospace;">${state.error}</div><button id="retry-btn" style="margin-top:16px;padding:8px 16px;border-radius:8px;border:none;background:#c0392b;color:#fff;cursor:pointer;font-weight:600;">Try Again</button></div>`;
  } else if (state.stage === "dashboard" && state.processed) {
    const filterBtns = ["All",...REPS].map(rep => {
      const cfg = rep==="All" ? {color:"#43474F",bg:"#e8e9ea"} : REP_CONFIG[rep];
      const act = state.activeRep === rep;
      return `<button class="filter-btn" data-rep="${rep}" style="padding:7px 16px;border-radius:20px;border:2px solid ${act?cfg.color:'#e5e7eb'};background:${act?cfg.bg:'#fff'};color:${act?cfg.color:'#666'};font-weight:${act?700:500};font-size:12px;cursor:pointer;">${rep==="All"?"All Reps":rep.split(" ")[0]}</button>`;
    }).join("");

    const repChips = REPS.map(rep => repChipHtml(rep, state.processed.repData[rep])).join("");

    body = `${businessPerfHtml(state.businessData)}
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">${bizCardHtml("Quotes Generated",state.processed.quotes,"#533FB7")}${bizCardHtml("Sales Orders Confirmed",state.processed.confirmed,"#1D9E75")}${bizCardHtml("New Opportunities",state.processed.opportunities,"#BA7517")}</div>
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">${filterBtns}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">${repChips}</div>
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">${metricCardHtml("Total Activities",totalCalls,"#43474F")}${metricCardHtml("Connected",totalConnected,"#1a7a4a")}${metricCardHtml("No Answer",totalNoAnswer,"#c0392b")}${metricCardHtml("Activity Types",activityTypes,"#533FB7")}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">${activityTableHtml(filteredRows)}${connectRateHtml(filteredRows)}</div>
      <div style="margin-bottom:16px;">${barChartHtml(filteredRows)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;"><div style="background:#fff;border-radius:12px;padding:24px;border:1.5px solid #f0f0f0;text-align:center;"><div style="font-size:13px;font-weight:700;color:#333;margin-bottom:16px;">Overall Connect Rate</div><div style="font-size:56px;font-weight:900;color:${connectRate>=50?'#F37032':'#E24B4A'};line-height:1;">${connectRate}%</div><div style="font-size:12px;color:#888;margin-top:8px;margin-bottom:16px;">${totalConnected} connected of ${totalCalls} total</div><div style="height:12px;background:#f3f4f6;border-radius:6px;overflow:hidden;"><div style="height:100%;width:${connectRate}%;background:#F37032;border-radius:6px;"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#999;margin-top:4px;"><span>No Answer ${100-connectRate}%</span><span>Connected ${connectRate}%</span></div></div>${repComparisonHtml()}</div>
      <div style="background:#fff;border-radius:12px;padding:20px;border:1.5px solid #f0f0f0;"><div style="font-size:13px;font-weight:700;color:#43474F;margin-bottom:14px;">Prospecting (Manual Entry)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">${prospectingInputsHtml(true)}</div><button id="apply-bottom-btn" style="margin-top:16px;padding:9px 20px;border-radius:8px;border:none;background:#F37032;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">Apply</button></div>
      ${activityLogHtml()}`;
  }

  document.getElementById("root").innerHTML = `${header}<div style="padding:24px 28px;max-width:1100px;margin:0 auto;">${body}</div>`;
  attachEvents();
}

function attachEvents() {
  const dpFrom = document.getElementById("date-from");
  if (dpFrom) dpFrom.addEventListener("change", e => { state.dateFrom = e.target.value; if (state.dateTo < state.dateFrom) { state.dateTo = state.dateFrom; const dpTo = document.getElementById("date-to"); if (dpTo) dpTo.value = state.dateTo; } });
  const dpTo = document.getElementById("date-to");
  if (dpTo) dpTo.addEventListener("change", e => { state.dateTo = e.target.value; if (state.dateFrom > state.dateTo) { state.dateFrom = state.dateTo; const dpF = document.getElementById("date-from"); if (dpF) dpF.value = state.dateFrom; } });

  const runBtn = document.getElementById("run-btn");
  if (runBtn) runBtn.addEventListener("click", handleRun);

  const retryBtn = document.getElementById("retry-btn");
  if (retryBtn) retryBtn.addEventListener("click", () => { state.stage = "idle"; render(); });

  const applyBottomBtn = document.getElementById("apply-bottom-btn");
  if (applyBottomBtn) applyBottomBtn.addEventListener("click", () => {
    const result = processData(state.rawData, state.prospectingDraft);
    state.prospecting = JSON.parse(JSON.stringify(state.prospectingDraft));
    state.processed = result;
    render();
  });

  document.querySelectorAll(".rep-chip").forEach(el => {
    el.addEventListener("click", () => { state.activeRep = el.dataset.rep === state.activeRep ? "All" : el.dataset.rep; render(); });
  });

  document.querySelectorAll("input[data-rep]").forEach(input => {
    input.addEventListener("change", e => {
      const rep = e.target.dataset.rep, field = e.target.dataset.field;
      if (!state.prospectingDraft[rep]) state.prospectingDraft[rep] = {total:0,connected:0};
      state.prospectingDraft[rep][field] = parseInt(e.target.value) || 0;
    });
  });

  document.querySelectorAll("input[name='log-rep-filter']").forEach(input => {
    input.addEventListener("change", e => { state.logRep = e.target.value; render(); });
  });

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.activeRep = btn.dataset.rep; render(); });
  });
}

async function handleRun() {
  if (state.stage === "loading") return;
  state.stage = "loading";
  state.error = "";
  render();
  try {
    const [odooData, bizData] = await Promise.all([
      fetchOdooData(state.dateFrom, state.dateTo),
      fetchBusinessData(state.dateTo),
    ]);
    state.rawData = odooData;
    state.businessData = bizData;
    const result = processData(odooData, state.prospectingDraft);
    state.processed = result;
    state.activeRep = "All";
    state.stage = "dashboard";
  } catch(e) {
    state.error = e.message || "Unknown error";
    state.stage = "error";
  }
  render();
}

render();
</script>
</body>
</html>
